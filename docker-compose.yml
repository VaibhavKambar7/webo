version : '3.8'

services: 
  redis:
    image: "redis:7.0-alpine"
    ports: 
     - "6379:6379"
    volumes:
     - redis_data:/data
  postgres:
    image: "postgres:15-alpine"
    ports:
     - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=dbname
    volumes:
     - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data: